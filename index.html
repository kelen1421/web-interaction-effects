<script>
(()=>{
const root=document.getElementById('web-interaction-gallery');
if(!root)return;
const $=s=>root.querySelector(s);
const effects=[
['L01','首次加载 Splash','load','首次进入的加载展示；进度仅作模拟。','splash'],
['L02','遮罩式转场','load','先遮住旧页，再切换并揭开新页。','mask'],
['L03','交叠式转场','load','旧页退出时，新页同时进入。','overlap'],

['L05','主视觉入场','load','主视觉区中的标题、主体与说明依次出现。','hero'],
['S01','平滑滚动','scroll','虚线代表目标位置，实心点平滑追赶。','smooth'],
['S02','单次滚动触发','scroll','进度达到25%时播放一次；来回拖动不重播。','once'],
['S03','向上离开后重置','scroll','回到25%之前重置，再进入时重播。','reset-up'],
['S04','双向离开后重置','scroll','退出25%—75%的区域就重置，重入时播放。','reset-both'],
['S05','分段式滚动','scroll','进度跨越分段边界时切换整段内容。','segment'],
['S06','滚动驱动文字','scroll','文字显现与缩放由进度连续控制。','text'],
['S07','滚动驱动裁剪','scroll','裁剪窗口随滚动进度逐渐展开。','clip'],
['S08','滚动驱动帧序列','scroll','模拟视频帧定位，使用60帧几何变化。','frames'],
['S09','竖向滚动转横移','scroll','用一段进度驱动内容横向移动。','horizontal'],
['S10','滚动驱动镜头','scroll','通过缩放与位移示意摄像机推进。','camera'],
['S11','滚动驱动模型','scroll','以立方体旋转示意三维模型动画。','model'],
['S12','滚动驱动场景','scroll','两组空间状态随进度切换，采用几何示意。','scene'],
['S13','竖向视差','scroll','前景与背景以不同速率竖向移动。','parallax-v'],
['S14','横向视差','scroll','前景与背景以不同速率横向移动。','parallax-h'],
['H01','瞬时悬停切换','hover','移入和移出立即切换状态，不加补间。','instant'],
['H02','对称悬停过渡','hover','移入放大，移出沿同一路径缩回。','symmetric'],
['H03','悬停揭示内容','hover','进入时显示原本隐藏的项目信息。','reveal'],
['H04','移入触发喷溅','hover','进入后独立播放；离开不会让粒子倒放。','burst'],
['H05','移入移出各触发','hover','进入和离开分别启动一次下划线绘制。','event-line'],
['H06','非对称色块','hover','移入左进，移出右退，不走原路。','asym-fill'],
['H07','非对称下划线','hover','下划线从左展开，离开时向右收起。','asym-line'],
['H08','方向感知悬停','hover','根据进入和离开的边缘决定遮罩方向。','direction'],
['H09','具体坐标揭示','hover','教学扩展：以进入位置作为圆形揭示中心。','point'],
['P01','弹簧动画','physics','弹簧力与阻尼决定运动；默认欠阻尼，越过目标后逐渐停稳。','spring'],
['P02','阻尼比＝1','physics','默认临界阻尼，从静止释放不来回振荡；可调低或调高对比。','critical'],
['P03','继承松手速度','physics','拖动后松手，保留释放瞬间的速度；勾选项可对比归零。','release'],
['P04','边界回弹组合','physics','临界阻尼＋松手速度＋边界碰撞；反弹来自独立的边界规则。','boundary']
].map(([id,name,group,summary,kind])=>({id,name,group,summary,kind}));
const groups={load:'加载与转场',scroll:'滚动交互',hover:'指针与悬停',physics:'弹簧与拖拽'};
const stage=$('[data-stage]'),slider=$('#wi-scroll'),status=$('[data-status]'),reduce=$('[data-reduce]');
const damping=$('#wi-damping'),velocity=$('#wi-velocity'),carry=$('[data-carry]');
let selected=effects[0],progress=0,prev=0,done=false,inside=false,lastDirection='left',cycle=0,raf=0,timers=[],animations=[],smoothPos=0;
let physics=null;
const mq=matchMedia('(prefers-reduced-motion: reduce)');reduce.checked=mq.matches;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const message=s=>{status.textContent=s};
const save=()=>{if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{effectId:selected.id,effectName:selected.name,...(selected.group==='physics'?{dampingRatio:Number(damping.value),releaseVelocity:Number(velocity.value),carryVelocity:carry.checked}:{})},privateContent:{progress,reduce:reduce.checked}}).catch(()=>{});};
const animate=(el,frames,options={})=>{
 if(!el)return null;
 const arr=Array.isArray(frames)?frames:[frames];
 if(reduce.checked){const last=arr[arr.length-1];for(const key of Object.keys(last))if(!['offset','easing','composite'].includes(key))el.style[key]=last[key];return null;}
 const a=el.animate(frames,{duration:650,easing:'cubic-bezier(.2,.7,.2,1)',fill:'forwards',...options});animations.push(a);return a;
};
function stop(){cycle++;cancelAnimationFrame(raf);raf=0;timers.forEach(clearTimeout);timers=[];animations.forEach(a=>a.cancel());animations=[];if(physics){physics.observer?.disconnect();physics.drag=null;physics=null;}}
function later(fn,ms){const c=cycle;timers.push(setTimeout(()=>{if(c===cycle)fn()},reduce.checked?0:ms));}
const mark=(label='A',extra='')=>'<div class="wi-mark '+extra+'">'+label+'</div>';
const page=(label,extra='')=>'<div class="wi-page '+extra+'">'+mark(label)+'<div class="wi-line"></div></div>';
const landscape=()=>'<div class="wi-land"><span class="wi-layer-label">背景</span><div class="wi-orb"></div><div class="wi-mountain"></div><div class="wi-horizon"></div></div>';
const cube=()=>'<div class="wi-cube">'+['f','b','r','l','t','d'].map((x,i)=>'<div class="wi-face '+x+'">'+(i+1)+'</div>').join('')+'</div>';
function build(){
 stop();done=false;inside=false;prev=0;smoothPos=0;
 const k=selected.kind;
 stage.dataset.effect=selected.id;
 if(selected.group==='load'){
  stage.innerHTML=k==='hero'?'<div class="wi-hero"><div data-part>让内容成为主角</div>'+mark('主视觉')+'<div data-part class="wi-line"></div></div>':page('A')+page('B','alt');
  const pages=stage.querySelectorAll('.wi-page');if(pages[1])pages[1].style.opacity='0';
 }else if(selected.group==='scroll'){
  if(k==='smooth')stage.innerHTML='<div class="wi-smooth-row"><div class="wi-smooth-ghost"></div><div class="wi-smooth-dot"></div></div>';

function springStep(x,v,target,zeta,dt,omega=8){
 const y=x-target,a=zeta*omega;

  const d=omega*Math.sqrt(zeta*zeta-1),r1=-a+d,r2=-a-d,b=(v-r2*y)/(r1-r2),c=y-b;
  nextY=b*Math.exp(r1*dt)+c*Math.exp(r2*dt);nextV=r1*b*Math.exp(r1*dt)+r2*c*Math.exp(r2*dt);

}
function advanceSpring(p,dt){

  if(p.boundary&&p.x<0){p.x=0;if(p.v<0){p.v=-p.v*.55;p.bounces++;}}

function restore(state){if(!state)return;const mc=state.modelContent,pc=state.privateContent;if(typeof pc?.reduce==='boolean')reduce.checked=pc.reduce;if(mc?.effectId)select(mc.effectId,false);if(selected.group==='scroll'&&typeof pc?.progress==='number')applyProgress(pc.progress);if(selected.group==='physics'){if(Number.isFinite(mc?.dampingRatio))damping.value=clamp(mc.dampingRatio,.2,2);if(Number.isFinite(mc?.releaseVelocity))velocity.value=clamp(mc.releaseVelocity,-4,4);if(typeof mc?.carryVelocity==='boolean')carry.checked=mc.carryVelocity;physics.zeta=Number(damping.value);physicsLabels();}}
$('[data-count]').textContent='视频与截图参考 · '+effects.length+' 项原理演示';
select(effects.some(e=>e.id===location.hash.slice(1))?location.hash.slice(1):(root.dataset.initialEffect||'L01'),false);restore(window.openai?.widgetState);
window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0;if(physics?.drag){physics.drag=null;physics.v=0;physics.running=true;}}else if(selected.kind==='smooth'){applyProgress(progress);}else if(physics?.running){runPhysics(physics.v,true);}});
})();
